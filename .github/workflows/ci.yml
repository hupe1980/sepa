name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    # Weekly, for the long fuzz run and the vendored-data drift check.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  msrv:
    name: MSRV (rust-version = 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features

  test:
    name: Test (${{ matrix.os }} · Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Install xmllint (XSD validation tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Install xmllint (XSD validation tests)
        if: runner.os == 'macOS'
        run: echo "xmllint ships with macOS"
      - name: Test — default features
        run: cargo test --all-targets
      - name: Test — all features
        run: cargo test --all-targets --all-features
      - name: Test — no default features
        run: cargo test --all-targets --no-default-features

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - ""
          - "--features serde"
          - "--features time"
          - "--features chrono"
          - "--features serde,time,chrono"
          - "--features time,chrono"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: cargo test --all-targets ${{ matrix.features }}

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [clippy]
    strategy:
      fail-fast: false
      matrix:
        target: [parse, identifiers, build_batch]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: ". -> target\nfuzz -> fuzz/target"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # The seeds are derived from the test fixtures and committed, so the
      # derivation is verified rather than assumed — D38's rule applied to a
      # generated artefact that is not a schema. A fixture added without
      # regenerating them is a document the read-path target never explores.
      - name: Seed corpus is up to date
        if: matrix.target == 'parse'
        run: python3 scripts/extract-fuzz-seeds.py --check
      # A short run on every push, a long one on the weekly schedule. The
      # targets assert invariants, not just absence of panics, so this is a
      # correctness gate rather than a crash hunt: `build_batch` checks that
      # every accepted document's text is inside the SEPA character set, and
      # `parse` checks that no figure is reported that the input did not carry.
      #
      # `fuzz/seeds/` is what makes the read-path target able to reach anything
      # at all. Random bytes essentially never form a well-formed ISO 20022
      # document, so an unseeded `parse` run explores the XML rejection path and
      # nothing else — measured: 315k unseeded executions did not rediscover the
      # sign-flip defect, and a seeded run finds it in seconds.
      - name: Fuzz
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SECS=600
          else
            SECS=60
          fi
          SEEDS=""
          if [ -d "fuzz/seeds/${{ matrix.target }}" ]; then
            SEEDS="fuzz/seeds/${{ matrix.target }}"
          fi
          cargo fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} $SEEDS -- -max_total_time=$SECS
      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  vendored-data:
    name: Vendored reference data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The XSD digests recorded in tests/xsd/README.md, re-checked. A schema
      # swapped for a defective mirror is the failure mode this catches — it
      # makes correct output fail validation, which invites "fixing" the writer.
      # See the "Not every mirror is correct" note in tests/xsd/README.md.
      - name: Verify pinned XSD digests
        run: ./scripts/check-vendored-data.sh
      # The registry table against SWIFT's own published examples, and the
      # cross-table invariants. These run in the normal suite too; naming them
      # here makes a data regression legible as one.
      - name: Reference-data conformance tests
        run: |
          cargo test --all-features --lib -- \
            iban::tests::every_published_registry_example_validates \
            iban::tests::every_registry_example_is_reproduced_from_its_own_bban \
            iban::tests::registry_has_full_swift_entry_count \
            iban::tests::registry_structures_are_well_formed \
            country::tests::every_iban_registry_country_is_a_country_code \
            country::tests::every_sepa_country_is_a_country_code \
            charset::tests::no_table_entry_maps_a_character_that_is_already_legal \
            charset::tests::every_replacement_is_itself_legal_and_non_empty \
            charset::tests::exactly_twenty_entries_lengthen_the_text \
            --exact

  # Every other job measures the crate against an artefact inside the
  # repository. This one asks whether those artefacts are still the current
  # ones — the blind spot that let a withdrawn EPC deadline reach a release
  # with the whole suite green. It is a job of its own so that an overdue
  # *reading* is not reported as a broken *build*.
  watch-list:
    name: Regulatory watch list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sources are still current
        run: cargo test --all-features --test watch -- --include-ignored

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny --all-features check
