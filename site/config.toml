base_url = "https://hupe1980.github.io/sepa"
title = "sepa — SEPA payments for Rust"
description = "SEPA payment messages for Rust: checked identifiers, XML builders, bank-report parsers and integer money."

default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false
minify_html = true
author = "hupe1980"

# Every page is reachable from the nav; a stale internal link is a bug.
[link_checker]
skip_prefixes = ["https://crates.io/", "https://docs.rs/"]

[markdown]
smart_punctuation = true
insert_anchor_links = "right"
external_links_target_blank = true
external_links_no_referrer = true

# Code highlighting follows the reader's colour scheme.
[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark-default"

[extra]
repo = "https://github.com/hupe1980/sepa"
crate_url = "https://crates.io/crates/sepa"
api_url = "https://docs.rs/sepa"
