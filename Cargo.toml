[package]
name         = "sepa"
version      = "0.8.0"
rust-version = "1.88"
edition      = "2024"
authors      = ["hupe1980"]
description  = """\
SEPA payment utilities for all five EPC payment schemes: SCT, SCT Inst, \
SDD Core, SDD B2B and One-Leg Out Instant (OCT Inst). Builds pain.001, \
pain.008, pain.007 and camt.055; parses pain.002 (incl. Verification of \
Payee), camt.029 and camt.052/053/054. IBAN, BIC, Creditor Identifier and \
ISO 11649 RF reference validation, structured addresses, EPC field rules and \
charset transliteration. Output is XSD-validated in CI against the ISO \
schemas and the German GBIC 5 subsets. No I/O, no async, no f64 in monetary \
arithmetic.\
"""
repository   = "https://github.com/hupe1980/sepa"
license      = "MIT OR Apache-2.0"
keywords     = ["sepa", "iban", "iso20022", "payments", "banking"]
exclude      = [
  "/.github",
  "/justfile",
  "/deny.toml",
  "/fuzz",
  "/schemas",
  # Maintenance scripts: they act on files that are not published.
  "/scripts",
  # The regulatory watch gate is a maintainer tool and is deliberately
  # time-dependent: it fails when a source falls due for a re-read. A consumer
  # who pins this crate must not inherit a test that starts failing on our
  # review calendar.
  "/tests/watch.rs",
  # The site's markdown is compile-tested by `site_doctests`, so it ships;
  # its templates, styles and build output are not needed to build the crate.
  "/site/templates",
  "/site/static",
  "/site/public",
  "/site/config.toml",
]
categories   = ["finance", "encoding"]
readme       = "README.md"

# The fuzz crate is standalone: it needs nightly and must not be pulled
# into `cargo test`/`cargo build` for the library.
[workspace]
exclude = ["fuzz"]

[features]
default = []
## Enable serde Serialize / Deserialize on all public types.
serde = ["dep:serde"]
## Convert between `IsoDate` / `IsoDateTime` and the `time` crate's types.
time = ["dep:time"]
## Convert between `IsoDate` / `IsoDateTime` and the `chrono` crate's types.
chrono = ["dep:chrono"]

[dependencies]
thiserror  = { version = "2", default-features = false }
quick-xml  = { version = "0.41", default-features = false }
serde      = { version = "1", features = ["derive"], optional = true }
# Date interop only — neither crate is used inside the library's own logic, so
# the calendar arithmetic stays dependency-free and identical in every build.
time       = { version = "0.3.47", default-features = false, optional = true }
chrono     = { version = "0.4", default-features = false, optional = true }

# A payments library parsing untrusted bank input warrants a strict lint floor.
[lints.rust]
missing_docs                = "deny"
unsafe_code                 = "forbid"
missing_debug_implementations = "warn"
unreachable_pub             = "warn"
rust_2018_idioms            = { level = "warn", priority = -1 }

[lints.clippy]
pedantic         = { level = "warn", priority = -1 }
cargo            = { level = "warn", priority = -1 }
# Panics and truncation are the failure modes that matter most here.
indexing_slicing = "warn"
unwrap_used      = "warn"
expect_used      = "warn"
panic            = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
multiple_crate_versions = "allow"

[dev-dependencies]
serde_json = "1"

