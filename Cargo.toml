[package]
name         = "sepa"
version      = "0.9.0"
rust-version = "1.88"
edition      = "2024"
authors      = ["hupe1980"]
description  = "SEPA identifiers and ISO 20022 payment messages: builders, bank-report parsers, validation and integer monetary arithmetic."
repository   = "https://github.com/hupe1980/sepa"
license      = "MIT OR Apache-2.0"
keywords     = ["sepa", "iban", "iso20022", "payments", "banking"]
exclude      = [
  "/.github",
  "/.specify",
  "/.claude",
  "/specs",
  "/concepts",
  "/justfile",
  "/deny.toml",
  "/fuzz",
  "/schemas",
  # Maintainer-only files.
  "/scripts",
  # Consumers must not inherit our time-dependent source-review gate.
  "/tests/watch.rs",
  # Site Markdown ships for doctests; site assets and build output do not.
  "/site/templates",
  "/site/static",
  "/site/public",
  "/site/config.toml",
]
categories   = ["finance", "encoding"]
readme       = "README.md"

[package.metadata.docs.rs]
all-features = true

# The standalone fuzz crate requires nightly.
[workspace]
exclude = ["fuzz"]

[features]
default = []
## Serialize/deserialize supported values, payment inputs and reports.
serde = ["dep:serde"]
## Convert between `IsoDate` / `IsoDateTime` and the `time` crate's types.
time = ["dep:time"]
## Convert between `IsoDate` / `IsoDateTime` and the `chrono` crate's types.
chrono = ["dep:chrono"]

[dependencies]
thiserror  = { version = "2", default-features = false }
quick-xml  = { version = "0.41", default-features = false }
serde      = { version = "1", features = ["derive"], optional = true }
# Optional interop; core calendar arithmetic is dependency-free.
time       = { version = "0.3.47", default-features = false, optional = true }
chrono     = { version = "0.4", default-features = false, optional = true }

# A payments library parsing untrusted bank input warrants a strict lint floor.
[lints.rust]
missing_docs                = "deny"
unsafe_code                 = "forbid"
missing_debug_implementations = "warn"
unreachable_pub             = "warn"
rust_2018_idioms            = { level = "warn", priority = -1 }

[lints.clippy]
pedantic         = { level = "warn", priority = -1 }
cargo            = { level = "warn", priority = -1 }
# Panics and truncation are the failure modes that matter most here.
indexing_slicing = "warn"
unwrap_used      = "warn"
expect_used      = "warn"
panic            = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
multiple_crate_versions = "allow"

[dev-dependencies]
serde_json = "1"

