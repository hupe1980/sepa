[package]
name         = "sepa"
version      = "0.7.0"
rust-version = "1.88"
edition      = "2024"
authors      = ["hupe1980"]
description  = """\
SEPA payment utilities: IBAN validation (ISO 13616 + 89-country registry), \
BIC validation (ISO 9362:2022), SEPA Creditor Identifier (EPC AT-02), \
pain.001 SCT + SCT Inst XML builder (pain.001.001.09 / .001.03 / .003.03), \
pain.008 SDD CORE + B2B XML builder (pain.008.001.08 / .001.02 / .003.02), \
pain.007 SDD reversal XML builder (pain.007.001.09), \
pain.002 status report parser incl. Verification of Payee, \
camt.055 payment cancellation (recall) builder + camt.029 resolution parser, \
camt.052/053/054 parsers, \
structured and hybrid postal addresses for the Nov 2026 EPC cut-over, \
ISO 11649 RF creditor references, EPC field validation and SEPA charset \
transliteration. Output is XSD-validated in CI against the ISO schemas and the \
German GBIC 5 subsets. Typed ISO 8601 dates, never defaulted from a clock. \
No I/O. No async. No f64 in monetary arithmetic.\
"""
repository   = "https://github.com/hupe1980/sepa"
license      = "MIT OR Apache-2.0"
keywords     = ["sepa", "iban", "iso20022", "payments", "banking"]
exclude      = [
  "/.github",
  "/justfile",
  "/deny.toml",
  "/fuzz",
  "/schemas",
  # The site's markdown is compile-tested by `site_doctests`, so it ships;
  # its templates, styles and build output are not needed to build the crate.
  "/site/templates",
  "/site/static",
  "/site/public",
  "/site/config.toml",
]
categories   = ["finance", "encoding"]
readme       = "README.md"

# The fuzz crate is standalone: it needs nightly and must not be pulled
# into `cargo test`/`cargo build` for the library.
[workspace]
exclude = ["fuzz"]

[features]
default = []
## Enable serde Serialize / Deserialize on all public types.
serde = ["dep:serde"]
## Convert between `IsoDate` / `IsoDateTime` and the `time` crate's types.
time = ["dep:time"]
## Convert between `IsoDate` / `IsoDateTime` and the `chrono` crate's types.
chrono = ["dep:chrono"]

[dependencies]
thiserror  = { version = "2", default-features = false }
quick-xml  = { version = "0.41", default-features = false }
serde      = { version = "1", features = ["derive"], optional = true }
# Date interop only — neither crate is used inside the library's own logic, so
# the calendar arithmetic stays dependency-free and identical in every build.
time       = { version = "0.3.47", default-features = false, optional = true }
chrono     = { version = "0.4", default-features = false, optional = true }

# A payments library parsing untrusted bank input warrants a strict lint floor.
[lints.rust]
missing_docs                = "deny"
unsafe_code                 = "forbid"
missing_debug_implementations = "warn"
unreachable_pub             = "warn"
rust_2018_idioms            = { level = "warn", priority = -1 }

[lints.clippy]
pedantic         = { level = "warn", priority = -1 }
cargo            = { level = "warn", priority = -1 }
# Panics and truncation are the failure modes that matter most here.
indexing_slicing = "warn"
unwrap_used      = "warn"
expect_used      = "warn"
panic            = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
multiple_crate_versions = "allow"

[dev-dependencies]
serde_json = "1"

[[test]]
name = "integration"
path = "tests/integration.rs"
