[package]
name         = "sepa-fuzz"
version      = "0.0.0"
publish      = false
edition      = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sepa          = { path = "..", features = ["serde", "json"] }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc  = false
bench = false

[[bin]]
name = "identifiers"
path = "fuzz_targets/identifiers.rs"
test = false
doc  = false
bench = false

# Named `build_batch`, not `build`: cargo forbids a binary target called
# `build`, and the whole fuzz crate fails to parse its manifest if one exists.
[[bin]]
name = "build_batch"
path = "fuzz_targets/build_batch.rs"
test = false
doc  = false
bench = false

[profile.release]
debug = 1
